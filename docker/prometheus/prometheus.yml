global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # IAM Service — actuator on 8081 exposes /actuator/prometheus
  - job_name: "iam-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["iam-service:8081"]
