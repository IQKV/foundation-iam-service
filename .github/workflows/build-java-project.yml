name: Build Java Project

on:
  push:
    branches: [dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Test
        run: ./mvnw clean verify
