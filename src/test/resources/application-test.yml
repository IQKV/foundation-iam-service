# ===================================================================
# Spring Boot configuration for the "test" profile.
# Activated via @ActiveProfiles("test") on test classes.
# Only contains overrides and test-specific values relative to application.yml.
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/system/db.changelog-master.xml
    contexts: demo
  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    liquibase: DEBUG

iqkv:
  database:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: "test"
    pool-size: 5
  liquibase:
    system-change-log: classpath:/db/changelog/system/db.changelog-master.xml
    tenant-change-log: classpath:/db/changelog/tenant/master.xml
    contexts: demo
    tenant-runner-enabled: false
  auth:
    jwt:
      private-key-path: classpath:keys/private.pem
      public-key-path: classpath:keys/public.pem
    security:
      password-encoder-strength: 4  # Reduced from 12 for faster test execution
  notification:
    mail:
      from: noreply@iqkv.com
      from-name: IQ Key Value
      reply-to: ""
    base-url: http://localhost:3000
  messaging:
    rabbitmq:
      enabled: false
