# ===================================================================
# Spring Boot configuration for the "test" profile.
# Activated via @ActiveProfiles("test") on test classes.
# Only contains overrides and test-specific values relative to application.yml.
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    enabled: true
  mail:
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    liquibase: DEBUG

iqkv:
  liquibase:
    system-change-log: classpath:/db/changelog/system/db.changelog-master.xml
    tenant-change-log: classpath:/db/changelog/tenant/master.xml
    contexts: demo
    tenant-runner-enabled: false
  auth:
    security:
      password-encoder-strength: 4  # Reduced from 12 for faster test execution
  messaging:
    rabbitmq:
      enabled: false
