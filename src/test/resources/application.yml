# ===================================================================
# Spring Boot configuration for tests.
# ===================================================================

spring:
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/system/db.changelog-master.xml
    contexts: demo
  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    liquibase: DEBUG

iqkv:
  database:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: "test"
    pool-size: 5
  liquibase:
    system-change-log: classpath:/db/changelog/system/db.changelog-master.xml
    tenant-change-log: classpath:/db/changelog/tenant/master.xml
    contexts: demo
    tenant-runner-enabled: false
  auth:
    jwt:
      private-key-path: classpath:keys/private.pem
      public-key-path: classpath:keys/public.pem
      expiry: PT15M
      refresh-expiry: P7D
      issuer: iqkv-iam-service
    security:
      password-encoder-strength: 4
      min-length: 8
      rate-limiting:
        login-attempts: 5
        lockout-duration: PT15M
    password-reset:
      token-ttl: PT1H
      rate-limit-window: PT15M
      rate-limit-max-requests: 3
  tenancy:
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  notification:
    mail:
      from: noreply@iqkv.com
      from-name: IQ Key Value
      reply-to: ""
    default-locale: en
    base-url: http://localhost:3000
  messaging:
    rabbitmq:
      enabled: false
