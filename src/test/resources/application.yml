# Spring Boot configuration — unit / context tests.
# Uses H2 in-memory DB; RabbitMQ and Liquibase are disabled so that
# @SpringBootTest context tests pass without external infrastructure.

spring:
  application:
    name: iam-service

  # In-memory datasource for context tests
  datasource:
    url: jdbc:h2:mem:iam_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Disable Liquibase (no migrations needed for scaffold tests)
  liquibase:
    enabled: false

  # Disable RabbitMQ auto-connect
  rabbitmq:
    host: localhost
    port: 5672
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
