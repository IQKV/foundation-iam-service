# ===================================================================
# Spring Boot configuration for the "production" profile.
# All secrets MUST be supplied via environment variables — no defaults.
# ===================================================================

spring:
  datasource:
    url: jdbc:postgresql://${iqscaffold.db.host}:${iqscaffold.db.port}/${iqscaffold.db.name}
    username: ${iqscaffold.db.username}
    password: ${iqscaffold.db.password}
  rabbitmq:
    host: ${iqscaffold.rabbitmq.host}
    port: ${iqscaffold.rabbitmq.port}
    username: ${iqscaffold.rabbitmq.username}
    password: ${iqscaffold.rabbitmq.password}
  liquibase:
    enabled: true
    contexts: "!demo"
  mail:
    host: ${iqscaffold.mail.host}
    port: ${iqscaffold.mail.port}
    username: ${iqscaffold.mail.username}
    password: ${iqscaffold.mail.password}
  mvc:
    pathmatch:
      use-suffix-pattern: false

server:
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

iqscaffold:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
  messaging:
    rabbitmq:
      enabled: true
