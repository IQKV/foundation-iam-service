# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-iam-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: false
  mail:
    host: ${iqkv.mail.host:localhost}
    port: ${iqkv.mail.port:587}
    username: ${iqkv.mail.username:dev}
    password: ${iqkv.mail.password:dev}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  platform:
    # Platform-wide operational mode: MULTI_TENANT (default) or SINGLE_TENANT
    # MULTI_TENANT: Each user signup creates a new tenant with TENANT_OWNER authority
    # SINGLE_TENANT: All users join a single pre-provisioned default tenant with MEMBER authority
    rollout-mode: ${ROLLOUT_MODE:MULTI_TENANT}
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:iamservice}
    username: ${DB_USERNAME:svc_iam_dba}
    password: ${DB_PASSWORD:svc_iam_dba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:svc_iam_rmq}
    password: ${RABBITMQ_PASSWORD:svc_iam_rmq}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@iqkv.com}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
      expiry: PT15M
      refresh-expiry: P7D
      issuer: foundation-iam-service
    security:
      password-encoder-strength: 12
      min-length: 8
      rate-limiting:
        login-attempts: 5
        lockout-duration: PT15M
    password-reset:
      token-ttl: PT1H
      rate-limit-window: PT15M
      rate-limit-max-requests: 3
  objectstorage:
    endpoint: ${OBJECTSTORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY:iqkv}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY:iqkv_password}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME:iam-assets}
    region: ${OBJECTSTORAGE_REGION:us-east-1}
    ssl: ${OBJECTSTORAGE_SSL:false}
    upload:
      max-file-size-bytes: ${OBJECTSTORAGE_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
      presigned-url-expiration-minutes: ${OBJECTSTORAGE_UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:60}
      allowed-mime-types: ${OBJECTSTORAGE_UPLOAD_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,image/gif}
  invitation:
    token-ttl: ${INVITATION_TOKEN_TTL:PT72H}
    reaper-interval: ${INVITATION_REAPER_INTERVAL:PT1H}
  billing:
    # Billing service base URL used by PlanCatalogCache for quota enforcement
    service-url: ${BILLING_SERVICE_URI:http://foundation-billing-service:8080}
    # How often the plan catalog cache is refreshed (ISO-8601 duration)
    plan-catalog-refresh-interval: ${PLAN_CATALOG_REFRESH_INTERVAL:PT10M}
    # Service token with PLATFORM_SERVICE authority for the internal plans endpoint
    service-token: ${BILLING_SERVICE_TOKEN:}
  tenancy:
    # Default tenant key for SINGLE_TENANT mode (optional)
    # If not provided, will be resolved from database or auto-generated
    # Format: 8-character NanoID using alphabet [a-z0-9]
    # Example: abc12345
    default-tenant-key: ${DEFAULT_TENANT_KEY:platform}
    # Display name for the default tenant in SINGLE_TENANT mode
    default-tenant-name: ${DEFAULT_TENANT_NAME:Acme Corp.}
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  liquibase:
    system-change-log: db/changelog/system/db.changelog-master.xml
    tenant-change-log: db/changelog/tenant/master.xml
  notification:
    mail:
      from: ${iqkv.mail.from}
      from-name: ${iqkv.mail.from-name}
      reply-to: ${iqkv.mail.reply-to}
    default-locale: en
    base-url: ${APP_BASE_URL:http://localhost:3000}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
