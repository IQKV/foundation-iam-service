# ===================================================================
# Spring Boot base configuration — overridden by active profile.
# ===================================================================

spring:
  application:
    name: foundation-iam-service
  datasource:
    url: jdbc:postgresql://${iqkv.db.host}:${iqkv.db.port}/${iqkv.db.name}
    username: ${iqkv.db.username}
    password: ${iqkv.db.password}
  rabbitmq:
    host: ${iqkv.rabbitmq.host}
    port: ${iqkv.rabbitmq.port}
    username: ${iqkv.rabbitmq.username}
    password: ${iqkv.rabbitmq.password}
  liquibase:
    enabled: false
  mail:
    host: ${iqkv.mail.host}
    port: ${iqkv.mail.port}
    username: ${iqkv.mail.username}
    password: ${iqkv.mail.password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

iqkv:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    name: ${DB_NAME:iam}
    username: ${DB_USERNAME:iam}
    password: ${DB_PASSWORD:iam}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:iam}
    password: ${RABBITMQ_PASSWORD:iam}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@iqkv.com}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
      expiry: PT15M
      refresh-expiry: P7D
      issuer: foundation-iam-service
    security:
      password-encoder-strength: 12
      min-length: 8
      rate-limiting:
        login-attempts: 5
        lockout-duration: PT15M
    password-reset:
      token-ttl: PT1H
      rate-limit-window: PT15M
      rate-limit-max-requests: 3
  tenancy:
    schema-prefix: t_
    default-schema: public
    provisioning-timeout: PT10M
  liquibase:
    system-change-log: db/changelog/system/db.changelog-master.xml
    tenant-change-log: db/changelog/tenant/master.xml
  notification:
    mail:
      from: ${iqkv.mail.from}
      from-name: ${iqkv.mail.from-name}
      reply-to: ${iqkv.mail.reply-to}
    default-locale: en
    base-url: ${APP_BASE_URL:http://localhost:3000}

git:
  build_time: "@git.build.time@"
  commit: "@git.commit.id.abbrev@"
info:
  app:
    build_time: ${git.build_time}
    description: "@project.description@"
    git_commit: ${git.commit}
    name: "@project.name@"
    version: "@project.version@"
