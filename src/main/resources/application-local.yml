# ===================================================================
# Spring Boot configuration for the "local" profile.
# ===================================================================

spring:
  datasource:
    url: jdbc:postgresql://${iqscaffold.db.host}:${iqscaffold.db.port}/${iqscaffold.db.name}
    username: ${iqscaffold.db.username}
    password: ${iqscaffold.db.password}
  rabbitmq:
    host: ${iqscaffold.rabbitmq.host}
    port: ${iqscaffold.rabbitmq.port}
    username: ${iqscaffold.rabbitmq.username}
    password: ${iqscaffold.rabbitmq.password}
  liquibase:
    enabled: true
    contexts: demo
  mail:
    host: ${iqscaffold.mail.host}
    port: ${iqscaffold.mail.port}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqscaffold: DEBUG
    org.mybatis: DEBUG

iqscaffold:
  db:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:iam}
    password: ${RABBITMQ_PASSWORD:iam}
  mail:
    host: localhost
    port: 1025
  auth:
    jwt:
      expiry: PT30M
      refresh-expiry: P30D
    security:
      min-length: 6
  messaging:
    rabbitmq:
      enabled: true
