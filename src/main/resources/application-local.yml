# ===================================================================
# Spring Boot configuration for the "local" profile.
# Overrides base: enables Liquibase with demo data, uses MailHog,
# relaxes SMTP auth, exposes all actuator endpoints, loosens JWT/password rules.
# ===================================================================

spring:
  liquibase:
    contexts: demo
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG

iqkv:
  mail:
    port: ${MAIL_PORT:1025}
  auth:
    jwt:
      expiry: PT30M
      refresh-expiry: P30D
    security:
      min-length: 8
  messaging:
    rabbitmq:
      enabled: true
