# ===================================================================
# Spring Boot configuration for the "dev" profile (K8s / dev cluster).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG

iqkv:
  db:
    host: ${DB_HOST:postgres}
    username: ${DB_USERNAME:iam}
    password: ${DB_PASSWORD:iam}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USERNAME:iam}
    password: ${RABBITMQ_PASSWORD:iam}
  messaging:
    rabbitmq:
      enabled: true
