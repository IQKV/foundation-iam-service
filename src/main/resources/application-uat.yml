# ===================================================================
# Spring Boot configuration for the "uat" profile (staging).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data,
# all secrets via env vars (no defaults).
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

server:
  shutdown: graceful

logging:
  level:
    com.iqkv: DEBUG

iqkv:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:IQ Key Value}
    reply-to: ${MAIL_REPLY_TO:}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
      issuer: ${JWT_ISSUER:foundation-iam-service}
  liquibase:
    contexts: demo
  messaging:
    rabbitmq:
      enabled: true
