# ===================================================================
# Spring Boot configuration for the "uat" profile (staging).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data,
# all secrets via env vars (no defaults).
# ===================================================================

spring:
  liquibase:
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG

iqkv:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
  objectstorage:
    endpoint: ${OBJECTSTORAGE_ENDPOINT}
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME}
    region: ${OBJECTSTORAGE_REGION}
    ssl: ${OBJECTSTORAGE_SSL}
  messaging:
    rabbitmq:
      enabled: true
