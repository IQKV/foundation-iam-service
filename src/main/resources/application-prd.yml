# ===================================================================
# Spring Boot configuration for the "prd" profile.
# Overrides base: all secrets via env vars (no defaults), hardens actuator/swagger.
# ===================================================================

spring:
  liquibase:
    contexts: "!demo"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

iqkv:
  db:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
  auth:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
  objectstorage:
    endpoint: ${OBJECTSTORAGE_ENDPOINT}
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME}
    region: ${OBJECTSTORAGE_REGION}
    ssl: ${OBJECTSTORAGE_SSL}
    upload:
      max-file-size-bytes: ${OBJECTSTORAGE_UPLOAD_MAX_FILE_SIZE_BYTES}
      presigned-url-expiration-minutes: ${OBJECTSTORAGE_UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES}
      allowed-mime-types: ${OBJECTSTORAGE_UPLOAD_ALLOWED_MIME_TYPES}
  messaging:
    rabbitmq:
      enabled: true
