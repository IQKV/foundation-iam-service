# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    contexts: demo
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: INFO
    liquibase: INFO

iqkv:
  db:
    host: ${DB_HOST:postgres}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  objectstorage:
    endpoint: ${OBJECTSTORAGE_ENDPOINT:http://foundation-infra-minio.iqkv-sit-env.svc.cluster.local:9000}
    public-endpoint: ${OBJECTSTORAGE_PUBLIC_ENDPOINT:}
    access-key: ${OBJECTSTORAGE_ACCESS_KEY:iqkv}
    secret-key: ${OBJECTSTORAGE_SECRET_KEY:iqkv_password}
    bucket-name: ${OBJECTSTORAGE_BUCKET_NAME:iam-assets}
  messaging:
    rabbitmq:
      enabled: true
