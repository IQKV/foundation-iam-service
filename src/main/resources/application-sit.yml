# ===================================================================
# Spring Boot configuration for the "sit" profile (K8s / SIT namespace).
# Overrides base: points to in-cluster service names, enables Liquibase with demo data.
# ===================================================================

spring:
  liquibase:
    enabled: true
    contexts: demo

logging:
  level:
    com.iqkv: DEBUG
    org.mybatis: DEBUG
    liquibase: DEBUG

iqkv:
  db:
    host: ${DB_HOST:postgres}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
  messaging:
    rabbitmq:
      enabled: true
