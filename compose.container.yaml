services:
  # PostgreSQL Database for IAM Service
  postgres-iam:
    extends:
      file: compose.base.yaml
      service: postgres-iam

  # RabbitMQ for IAM Service
  rabbitmq-iam:
    extends:
      file: compose.base.yaml
      service: rabbitmq-iam

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # MinIO S3-compatible object storage
  minio:
    extends:
      file: compose.base.yaml
      service: minio

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

  # IAM Service - Full platform run including build phase
  iam-service:
    extends:
      file: compose.base.yaml
      service: iam-service

networks:
  iam-service-network:
    name: foundation-iam-network-dev
    external: false

volumes:
  postgres_iam_data:
    name: iqkv_iam_postgres_data_dev
  rabbitmq_iam_data:
    name: iqkv_iam_rabbitmq_data_dev
  minio_iam_data:
    name: iqkv_iam_minio_data_dev
  dbgate_iam_data:
    name: iqkv_iam_dbgate_data_dev
  iam_logs:
    name: iqkv_iam_logs_dev
  iam_tmp:
    name: iqkv_iam_tmp_dev
