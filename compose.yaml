services:
  # PostgreSQL Database for IAM Service
  postgres-iam:
    extends:
      file: compose.base.yaml
      service: postgres-iam

  # RabbitMQ for IAM Service
  rabbitmq-iam:
    extends:
      file: compose.base.yaml
      service: rabbitmq-iam

  # Redis for OIDC state/PKCE, lockouts, and ephemeral security state
  redis-iam:
    extends:
      file: compose.base.yaml
      service: redis-iam

  # MailHog for local email testing
  mailhog:
    extends:
      file: compose.base.yaml
      service: mailhog

  # MinIO S3-compatible object storage
  minio:
    extends:
      file: compose.base.yaml
      service: minio

  # DbGate - Database Administration Tool
  dbgate:
    extends:
      file: compose.base.yaml
      service: dbgate

networks:
  iam-service-network:
    name: foundation-iam-network-dev
    external: false

volumes:
  postgres_iam_data:
    name: iqkv_iam_postgres_data_dev
  rabbitmq_iam_data:
    name: iqkv_iam_rabbitmq_data_dev
  redis_iam_data:
    name: iqkv_iam_redis_data_dev
  minio_iam_data:
    name: iqkv_iam_minio_data_dev
  dbgate_iam_data:
    name: iqkv_iam_dbgate_data_dev
